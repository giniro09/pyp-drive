<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wayfaring — 小さな遠征</title>
<style>
:root{color-scheme:dark;--bg:#20221e;--ink:#f0eada;--muted:#b7b7a6;--accent:#edb087}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,'Meiryo',sans-serif}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--accent);outline-offset:4px}button:disabled{cursor:default;opacity:.45}header{max-width:1040px;margin:auto;padding:22px 28px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #535649}header b{font:italic bold 32px Georgia,serif}header span{color:var(--muted);font-size:12px}main{max-width:1040px;margin:auto;padding:24px 28px 36px}h1{font:500 30px/1.4 Georgia,'Meiryo',serif;margin:8px 0 12px}h2{font-size:19px;font-weight:500;margin:0 0 8px}p{margin:8px 0;color:var(--muted)}.eyebrow{letter-spacing:.12em;font-size:12px;color:var(--accent)}.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:42px;align-items:center}.hero{width:100%;max-height:280px;object-fit:contain;filter:drop-shadow(0 18px 20px #0005)}.goals{display:flex;gap:12px;margin:26px 0}.goal{flex:1;text-align:left;background:transparent;border:1px solid #646655;padding:16px;border-radius:4px}.goal[aria-pressed=true]{border-color:var(--accent);background:#edb0870a}.goal small{display:block;color:var(--muted);line-height:1.6;margin-top:6px}.primary{border:0;background:var(--ink);color:var(--bg);padding:12px 24px;border-radius:3px;font-weight:600}.quiet{background:none;border:1px solid #777a67;padding:10px 18px;border-radius:3px}.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.stock{margin-top:28px;padding-top:16px;border-top:1px solid #535649;color:var(--muted)}.goal-progress{font-size:14px;color:var(--accent)}.road-header{display:flex;justify-content:space-between;gap:18px;align-items:start}.dial{height:470px;position:relative;max-width:760px;margin:0 auto}.ring{width:270px;height:270px;border:1px solid #747969;border-radius:50%;position:absolute;left:50%;top:55%;transform:translate(-50%,-50%)}.ring:before,.ring:after{content:'';position:absolute;background:#8b9078;left:50%;top:50%;width:1px;height:100px;transform-origin:top}.ring:after{transform:rotate(90deg)}.ring:before{transform:rotate(-90deg)}.stem{position:absolute;left:50%;top:60%;height:100px;border-left:4px solid var(--accent)}.center{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);background:var(--bg);padding:16px;text-align:center;font-size:14px;color:var(--muted)}.branch{position:absolute;border:0;background:var(--bg);text-align:center;width:172px;padding:6px;transition:transform .15s}.branch:hover{transform:translateY(-4px)}.branch.left{left:0;top:160px}.branch.straight{left:calc(50% - 86px);top:0}.branch.right{right:0;top:160px}.branch img{height:108px;width:132px;object-fit:contain;display:block;margin:auto}.branch strong{display:block;font-size:18px;font-weight:500}.branch small{display:block;color:var(--muted);font-size:13px}.branch .needed{color:var(--accent)}.unknown{height:108px;display:grid;place-items:center;font:italic 76px Georgia;color:#c8bade}.actions{display:flex;justify-content:center;gap:16px;flex-wrap:wrap}.bag{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}.item{background:#2d3028;border:1px solid #626752;padding:14px 18px;border-radius:4px}.item[aria-pressed=true]{border-color:var(--accent);background:#edb08713}.item span{font-size:12px;color:var(--muted);display:block}.notice{min-height:28px;color:var(--accent);margin:12px 0}.feedback{margin-top:30px;border-top:1px solid #535649;padding-top:16px}.feedback textarea{width:100%;min-height:80px;padding:12px;color:var(--ink);background:#292c24;border:1px solid #676c59;font:inherit}.receipt{max-width:640px;margin:24px auto}.receipt img{width:180px;height:180px;object-fit:contain;float:right}.help{font-size:13px;max-width:640px}footer{margin-top:24px;color:var(--muted);font-size:12px}a{color:var(--accent)}@media(max-width:620px){header{padding:16px}header b{font-size:26px}main{padding:20px 16px}.home-grid{grid-template-columns:1fr;gap:0}.hero{max-height:170px}.goals{margin:16px 0;gap:8px}.goal{padding:12px}.dial{height:440px}.ring{width:190px;height:190px}.branch{width:108px;padding:0}.branch.left{top:180px}.branch.right{top:180px}.branch.straight{left:calc(50% - 54px)}.branch img{width:100px;height:90px}.branch strong{font-size:15px}.branch small{font-size:12px}.unknown{height:90px}.center{font-size:12px;padding:8px}.road-header{font-size:13px}h1{font-size:25px}.stem{height:80px}.receipt img{width:120px;height:120px}.goal-progress{font-size:13px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><header><b>wayfaring</b><span>小さな遠征 · 仮想ルート試作</span></header><main id="app"></main>
<script type="module">
import{initial,recipes,names,prices,capacity,start,offers,choose,settle,canBuild,build}from './playtest-model.js';
const KEY='wayfaring_product_trial_v1';let s;try{s=JSON.parse(localStorage.getItem(KEY));}catch{}if(!s||s.version!==1)s=initial();let selected=new Set(),receipt=null,message='';const app=document.querySelector('#app');
function save(){localStorage.setItem(KEY,JSON.stringify(s));}function art(type){return type==='relic'?'<div class="unknown" aria-hidden="true">◈</div>':`<img src="assets/loot/${type}.png" alt="${names[type]}">`;}
function materialCount(type){return s.stock[type]+s.bag.filter((item,i)=>item.type===type&&(s.phase!=='haul'||selected.has(i))).length;}
function progress(){const r=recipes[s.goal];if(s.gear.includes(s.goal))return r.name+' · 装備中';return `${r.name}まで：部品 ${Math.min(r.parts,materialCount('parts'))}/${r.parts} · 物資 ${Math.min(r.supply,materialCount('supply'))}/${r.supply}`;}
function need(type){const r=recipes[s.goal];return !s.gear.includes(s.goal)&&r[type]>materialCount(type);}
function render(){save();if(receipt){app.innerHTML=`<section class="receipt">${art(receipt.type)}<div class="eyebrow">選んだ道で見つけたもの</div><h1>${receipt.count?names[receipt.type]+' ×'+receipt.count:'ここは回収済み'}</h1><p>${receipt.count&&need(receipt.type)?'もう少しで装備に手が届く。':receipt.old?'同じ場所からの再回収はできません。':'帰還時に持ち帰るものを選べます。'}</p><p>トレイ ${s.bag.length}個 ／ 持ち帰り ${capacity(s)}枠</p><button class="primary" data-action="continue">${s.step===3?'帰還して荷ほどき':'次の分岐へ'}</button></section>`;return;}
if(s.phase==='home'){const r=recipes[s.goal],owned=s.gear.includes(s.goal);app.innerHTML=`<div class="home-grid"><section><div class="eyebrow">${s.trip?'遠征から、次の遠征へ':'知らない道に、欲しいものがある'}</div><h1>${s.gear.length?'次は、何を探そう。':'あの反応の正体を、知りたい。'}</h1><p>道を選び、拾い、持ち帰る。<br>今回は、次の遠征が変わる道具をひとつ。</p><div class="goal-progress">${progress()}</div></section><img class="hero" src="assets/loot/${s.goal==='scanner'?'parts':'supply'}.png" alt="今回の装備のイメージ"></div><div class="goals">${Object.entries(recipes).map(([id,r])=>`<button class="goal" aria-pressed="${s.goal===id}" data-goal="${id}"><h2>${r.name}${s.gear.includes(id)?' ✓':''}</h2><small>${r.description}</small><small>部品${r.parts} + 物資${r.supply} · ${r.cost}G</small></button>`).join('')}</div><div class="row"><button class="primary" data-action="depart">${s.trip?'もう一度、出かける':'探索に出る'} · 5G</button>${!owned?`<button class="quiet" data-action="build" ${canBuild(s,s.goal)?'':'disabled'}>${r.name}を組み立てる</button>`:'<span class="goal-progress">装備中 · 次の探索に効果が出ます</span>'}</div><p class="notice" role="status">${message}</p><div class="stock">倉庫：部品 ${s.stock.parts} · 物資 ${s.stock.supply} · 観測記録 ${s.stock.relic} ／ ${s.money}G<br>持ち帰り ${capacity(s)}枠${s.gear.includes('scanner')?' · 未知反応を識別可能':''}</div>${s.trip?feedback():''}<footer>実道路・位置情報は使いません。約3分の仮想プレイです。既存ゲームの保存データとは別です。<br>資金不足でも5Gを借りて出発でき、探索は止まりません。</footer>`;}
else if(s.phase==='road'){const os=offers(s);app.innerHTML=`<div class="road-header"><div><div class="eyebrow">遠征 ${s.trip} · 分岐 ${s.step+1}/3</div><div class="goal-progress">${progress()}</div></div><div>トレイ ${s.bag.length}個 · 持帰 ${capacity(s)}枠<br>${s.distance.toFixed(1)} km ／ ${s.money}G</div></div><div class="dial"><div class="ring"></div><div class="stem"></div><div class="center">どこへ<br>寄り道しよう</div>${os.map((o,i)=>`<button class="branch ${['left','straight','right'][i]}" data-choice="${i}" aria-label="${['左','直進','右'][i]}、${o.name}、${o.km}キロ">${o.old?'<div class="unknown">·</div>':o.hidden?'<div class="unknown">?</div>':art(o.type)}<strong>${o.name}${o.hidden||o.old?'':' ×'+o.count}</strong><small>${o.km.toFixed(1)} km · 遠征費 ${Math.ceil(o.km*2)}G</small><small class="needed">${!o.hidden&&!o.old&&need(o.type)?'装備の材料になる':o.hidden?'部品？ 物資？ 高値の記録？':o.type==='relic'?'売却 18G / 個':'売却 '+prices[o.type]+'G / 個'}</small></button>`).join('')}</div><div class="actions"><button class="quiet" data-action="roulette">運に任せる · +3G</button><button class="quiet" data-action="return">いま帰還する</button></div><p class="help">欲しい材料を狙うか、未知に賭けるか。持ち帰れない分は売却できます。寄り道には距離に応じた遠征費がかかります。ルーレットは方向を選べない代わりに3Gを得ます。</p>`;}
else{app.innerHTML=`<section class="receipt"><div class="eyebrow">帰還 · ${s.distance.toFixed(1)} km</div><h1>次の探索に、何を残す？</h1><p>${capacity(s)}個まで倉庫へ。残りは売却します。</p><div class="goal-progress">${progress()}</div><div class="bag">${s.bag.map((item,i)=>`<button class="item" data-keep="${i}" aria-pressed="${selected.has(i)}">${names[item.type]}<span>${need(item.type)?'装備の材料 · ':''}売却 ${prices[item.type]}G</span></button>`).join('')||'<p>今回は手ぶら。でも回収地点は次に狙えます。</p>'}</div><p role="status">${selected.size}/${capacity(s)}個を持ち帰る</p><button class="primary" data-action="settle">荷ほどきを終える</button></section>`;} }
function feedback(){return `<section class="feedback"><h2>試して、どうだった？</h2><p class="help">①選ぶときに迷った箇所 ②装備を作りたくなったか ③もう一度走る理由があったか</p><textarea id="feedback" aria-label="プレイの感想" placeholder="遠慮なく。分かりにくい・何も迷わなかった、も大事な結果です。"></textarea><button class="quiet" data-action="report">感想とプレイ記録をコピー</button><p class="help">コピー後、このチャットへ貼ってください。自動送信はしません。</p></section>`;}
app.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;message='';if(b.dataset.goal){s.goal=b.dataset.goal;render();return;}if(b.dataset.choice!=null){receipt=choose(s,+b.dataset.choice);render();return;}if(b.dataset.keep!=null){const i=+b.dataset.keep;if(selected.has(i))selected.delete(i);else if(selected.size<capacity(s))selected.add(i);render();return;}switch(b.dataset.action){case'depart':start(s);break;case'build':if(build(s,s.goal))message=recipes[s.goal].name+'が完成。'+recipes[s.goal].description;break;case'continue':receipt=null;if(s.phase==='haul')selected=new Set();break;case'roulette':receipt=choose(s,Math.floor(Math.random()*3),true);break;case'return':s.phase='haul';selected=new Set();break;case'settle':settle(s,[...selected]);selected=new Set();break;case'report':{const report=JSON.stringify({feedback:document.querySelector('#feedback').value,gear:s.gear,events:s.events},null,2);try{await navigator.clipboard.writeText(report);b.textContent='コピーしました';}catch{b.textContent='コピーできません。感想を直接チャットへお願いします';}return;}}render();});render();
</script></body></html>
